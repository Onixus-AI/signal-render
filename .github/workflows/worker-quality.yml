name: Worker Quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm test
      - run: node --check server.js

  effectcraft:
    # Renders a real Command beat with EffectCraft and keeps the stills, so the
    # motion design is graded on actual frames. Non-blocking until the release
    # is pinned in the Dockerfile.
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install EffectCraft
        run: |
          gh release view --repo storytold/effectcraft --json tagName,publishedAt -q '"tag=\(.tagName) published=\(.publishedAt)"'
          gh release download --repo storytold/effectcraft --pattern '*-linux-x86_64.tar.gz' --dir /tmp/ec
          sha256sum /tmp/ec/*.tar.gz
          mkdir -p /tmp/ec/x && tar -xzf /tmp/ec/*.tar.gz -C /tmp/ec/x
          find /tmp/ec/x -maxdepth 4 -type f | head -20
          echo "EFFECTCRAFT_CLI=$(find /tmp/ec/x -type f -name effectcraft-cli | head -1)" >> "$GITHUB_ENV"
      - run: $EFFECTCRAFT_CLI --version
      - run: node scripts/effectcraft-smoke.mjs effectcraft-smoke
      - name: Publish contact sheets to the ci/effectcraft-previews branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          mkdir -p /tmp/prev && cp effectcraft-smoke/sheet-*.jpg /tmp/prev/
          cd /tmp/prev && git init -q -b ci/effectcraft-previews
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "previews for ${{ github.event.pull_request.head.sha }}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}" HEAD:ci/effectcraft-previews
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: effectcraft-smoke
          path: |
            effectcraft-smoke/*.png
            effectcraft-smoke/*.mp4
            effectcraft-smoke/*.jsx
          if-no-files-found: warn
